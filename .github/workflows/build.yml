name: Build Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with coverage gate
        shell: bash
        run: scripts/coverage.sh 70

      - name: Build binary
        run: go build -v -ldflags "-H=windowsgui" -o netscan.exe ./cmd/netscan

      - name: Smoke test binary
        shell: bash
        run: scripts/smoke.sh "$PWD/netscan.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netscan-windows-amd64
          path: netscan.exe

  test-linux:
    name: Test (Linux, race detector)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Vet without tray
        run: go vet -tags notray ./cmd/netscan ./internal/tray

      - name: Test
        run: go test -race ./...
