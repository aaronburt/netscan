name: Build Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with coverage gate
        shell: bash
        run: bash scripts/coverage.sh 70

      - name: Build binary
        run: go build -v -ldflags "-H=windowsgui" -o netscan.exe ./cmd/netscan

      - name: Smoke test binary
        shell: bash
        run: |
          for p in standard aggressive lax; do scripts/smoke.sh "$PWD/netscan.exe" "$p"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netscan-windows-amd64
          path: netscan.exe

  test-linux:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-latest
            goarch: amd64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Vet without tray
        run: go vet -tags notray ./cmd/netscan ./internal/tray

      - name: Test with race detector
        run: go test -race ./...

      - name: Coverage gate
        run: bash scripts/coverage.sh 70

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: go build -v -tags notray -o netscan ./cmd/netscan

      - name: Smoke test binary
        run: |
          for p in standard aggressive lax; do bash scripts/smoke.sh "$PWD/netscan" "$p"; done
