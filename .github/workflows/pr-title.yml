name: PR title

# Every merge to main is a minor release, so the title no longer sets the
# version. It still needs a type prefix for readable history. Breaking-change
# markers ("!") are rejected because major releases are only made manually.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([^)]+\))?!:'; then
            echo "::error::Breaking-change '!' is not allowed in PR titles. Major releases are made manually (Actions -> Release -> Run workflow, bump=major)."
            exit 1
          fi
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([^)]+\))?: .+'; then
            echo "::error::PR title must start with a type, e.g. 'fix: ...' or 'feat(ui): ...'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, style, revert. The type does not change the release number."
            exit 1
          fi
