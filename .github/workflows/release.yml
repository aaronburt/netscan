name: Release

# Every merge to main ships a release:
#   PR title "feat: ..."      -> minor bump (0.5.0 -> 0.6.0)
#   any other PR title        -> patch bump (0.5.0 -> 0.5.1)
# Major bumps are never automatic. Run this workflow manually with bump=major.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a manual release (use major for a major release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      rebuild_tag:
        description: Optional. Existing tag (e.g. v0.5.0) to rebuild and re-upload assets for, instead of cutting a new release
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.rebuild_tag }}" ]; then
            tag="${{ inputs.rebuild_tag }}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="${{ inputs.bump }}"
          if [ -z "$bump" ] || [ "$bump" = "auto" ]; then
            title=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].title // empty' || true)
            [ -n "$title" ] || title=$(git log -1 --format=%s)
            echo "Release title: $title"
            # Only feat is a minor bump. Everything else, including "!" breaking
            # markers, is a patch: majors are decided manually.
            if echo "$title" | grep -Eiq '^feat(\([^)]*\))?!?:'; then bump=minor; else bump=patch; fi
          fi

          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          last=${last:-v0.0.0}
          IFS=. read -r maj min pat <<< "${last#v}"
          case "$bump" in
            major) maj=$((maj+1)); min=0; pat=0 ;;
            minor) min=$((min+1)); pat=0 ;;
            patch) pat=$((pat+1)) ;;
          esac
          new="$maj.$min.$pat"
          echo "$last -> v$new ($bump)"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "-X main.version=$env:VERSION"
          go build -ldflags "-H=windowsgui $v" -o dist\netscan.exe ./cmd/netscan
          go build -ldflags "-s -w $v" -o dist\updater.exe ./cmd/updater
          go build -ldflags "-s -w -H=windowsgui $v" -o dist\installer-base.exe ./cmd/installer

      - name: Package
        run: |
          Compress-Archive -Path dist\netscan.exe, dist\updater.exe -DestinationPath dist\netscan-windows-amd64.zip -Force
          cmd /c copy /b dist\installer-base.exe+dist\netscan-windows-amd64.zip dist\netscan-installer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist\installer-base.exe
          Push-Location dist
          Get-ChildItem netscan.exe, updater.exe, netscan-windows-amd64.zip, netscan-installer.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii checksums.txt
          Pop-Location

      # The tag and release are created only after a successful build, so a
      # release never exists without its binaries.
      - name: Publish release
        run: |
          $files = "dist\netscan.exe", "dist\netscan-windows-amd64.zip", "dist\netscan-installer.exe", "dist\updater.exe", "dist\checksums.txt"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --target "${{ needs.version.outputs.ref }}" --title $env:TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
