name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "0.1.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -v -ldflags "-H=windowsgui -X main.version=$ver" -o dist/netscan.exe ./cmd/netscan
          go build -v -ldflags "-s -w" -o dist/updater.exe ./cmd/updater
          go build -v -ldflags "-s -w -H=windowsgui -X main.version=$ver" -o dist/installer-base.exe ./cmd/installer

      - name: Package archive and installer
        run: |
          Compress-Archive -Path dist/netscan.exe, dist/updater.exe -DestinationPath dist/netscan-windows-amd64.zip
          cmd /c copy /b dist\installer-base.exe+dist\netscan-windows-amd64.zip dist\netscan-installer.exe
          Remove-Item dist/installer-base.exe

      - name: Generate checksums
        run: |
          $files = @("netscan.exe", "updater.exe", "netscan-windows-amd64.zip", "netscan-installer.exe")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $lines | Set-Content -Path "dist/checksums.txt" -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netscan.exe
            dist/updater.exe
            dist/netscan-windows-amd64.zip
            dist/netscan-installer.exe
            dist/checksums.txt
          generate_release_notes: true
