name: Release

# Every merge to main ships a release:
#   PR title "feat: ..."      -> minor bump (0.5.0 -> 0.6.0)
#   any other PR title        -> patch bump (0.5.0 -> 0.5.1)
# Major bumps are never automatic. Run this workflow manually with bump=major.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a manual release (use major for a major release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      rebuild_tag:
        description: Optional. Existing tag (e.g. v0.5.0) to rebuild and re-upload assets for, instead of cutting a new release
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.rebuild_tag }}" ]; then
            tag="${{ inputs.rebuild_tag }}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="${{ inputs.bump }}"
          if [ -z "$bump" ] || [ "$bump" = "auto" ]; then
            title=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].title // empty' || true)
            [ -n "$title" ] || title=$(git log -1 --format=%s)
            echo "Release title: $title"
            # Only feat is a minor bump. Everything else, including "!" breaking
            # markers, is a patch: majors are decided manually.
            if echo "$title" | grep -Eiq '^feat(\([^)]*\))?!?:'; then bump=minor; else bump=patch; fi
          fi

          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          last=${last:-v0.0.0}
          IFS=. read -r maj min pat <<< "${last#v}"
          case "$bump" in
            major) maj=$((maj+1)); min=0; pat=0 ;;
            minor) min=$((min+1)); pat=0 ;;
            patch) pat=$((pat+1)) ;;
          esac
          new="$maj.$min.$pat"
          echo "$last -> v$new ($bump)"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "-X main.version=$env:VERSION"
          go build -ldflags "-H=windowsgui $v" -o dist\netscan.exe ./cmd/netscan
          go build -ldflags "-s -w $v" -o dist\updater.exe ./cmd/updater
          go build -ldflags "-s -w -H=windowsgui $v" -o dist\installer-base.exe ./cmd/installer

      - name: Package
        run: |
          Compress-Archive -Path dist\netscan.exe, dist\updater.exe -DestinationPath dist\netscan-windows-amd64.zip -Force
          cmd /c copy /b dist\installer-base.exe+dist\netscan-windows-amd64.zip dist\netscan-installer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist\installer-base.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/netscan.exe
            dist/updater.exe
            dist/netscan-windows-amd64.zip
            dist/netscan-installer.exe
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goarch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Static, headless-only binary: no CGO and no tray dependencies.
      - name: Build
        run: |
          mkdir -p dist/pkg
          CGO_ENABLED=0 GOOS=linux go build -trimpath -tags notray \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/pkg/netscan ./cmd/netscan

      - name: Package
        run: |
          name="netscan-linux-$GOARCH"
          cp packaging/systemd/netscan.service packaging/linux/install.sh packaging/linux/uninstall.sh dist/pkg/
          chmod 0755 dist/pkg/netscan dist/pkg/install.sh dist/pkg/uninstall.sh
          mv dist/pkg "dist/$name"
          tar -C dist --owner=0 --group=0 -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/netscan-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  # The tag and release are created only after every build succeeded, so a
  # release never exists without its binaries.
  publish:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          ls -l
          sha256sum netscan.exe updater.exe netscan-windows-amd64.zip netscan-installer.exe \
            netscan-linux-amd64.tar.gz netscan-linux-arm64.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish release
        working-directory: assets
        run: |
          files="netscan.exe updater.exe netscan-windows-amd64.zip netscan-installer.exe netscan-linux-amd64.tar.gz netscan-linux-arm64.tar.gz checksums.txt"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" $files --repo "${{ github.repository }}" \
              --target "${{ needs.version.outputs.ref }}" --title "$TAG" --generate-notes
          fi

  # Runs after publish, so the image always matches a release that exists. If
  # this job fails, the release stays and the run can be retried.
  image:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REBUILD_TAG: ${{ inputs.rebuild_tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        shell: bash
        run: |
          tags="$IMAGE:$VERSION"
          # Rebuilding an old tag must not move latest backwards.
          if [ -z "$REBUILD_TAG" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"

      # Both architectures build natively: the Go stage runs on this runner and
      # cross-compiles, so no QEMU is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
